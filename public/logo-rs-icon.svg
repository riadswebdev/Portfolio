<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="55%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0c4a6e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#04060c"/>
  <!-- Inner gradient accent -->
  <rect width="100" height="100" rx="22" fill="url(#g2)"/>

  <!-- Border ring -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="21"
        stroke="url(#g1)" stroke-width="1.5" stroke-opacity="0.40" fill="none"/>

  <!-- Corner L-brackets -->
  <polyline points="1.5,24 1.5,1.5 24,1.5"
            stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polyline points="98.5,76 98.5,98.5 76,98.5"
            stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Monogram MRS -->
  <g filter="url(#glow2)">
    <text x="50" y="60"
          font-family="'Inter','Segoe UI',system-ui,sans-serif"
          font-size="40" font-weight="900" letter-spacing="-3"
          fill="url(#g1)" text-anchor="middle">MRS</text>
  </g>

  <!-- Underline dot row -->
  <circle cx="41" cy="76" r="2" fill="#22d3ee" fill-opacity="0.7"/>
  <circle cx="50" cy="76" r="2" fill="#3b82f6" fill-opacity="0.7"/>
  <circle cx="59" cy="76" r="2" fill="#818cf8" fill-opacity="0.7"/>
</svg>
